# ───────────────────────────────────────────────
#  Предполётные проверки на каждый push и pull request.
#
#  Зачем: те же проверки уже гоняет deploy.sh НА СЕРВЕРЕ, но там они —
#  последний рубеж: если что-то не так, обновление откатывается, а бот
#  на минуту остаётся на старом коде. Здесь они срабатывают ДО слияния,
#  и поломка видна прямо в pull request.
#
#  ⚠️ Ключи и сеть не нужны: preflight.py собирает Application с ненастоящим
#  токеном правильной формы и никуда не ходит. Секреты сюда не добавлять —
#  проверка, падающая из-за молчащего Google, однажды остановит исправную
#  работу (то же правило записано в самом preflight.py).
#  ⚠️ Версия питона — та же, что на сервере (3.12). Разъедутся — CI начнёт
#  пропускать то, на чём боевой бот споткнётся.
# ───────────────────────────────────────────────
name: Предполётные проверки

# Ветки проверяются через их pull request, а main — ещё и после слияния:
# бот забирает main САМ раз в 10 минут (jobs/update.py), поэтому сломанный
# main — это сломанный бот в ближайшие десять минут, и знать об этом надо
# сразу. На каждый push в рабочую ветку не гоняем: тот же прогон уже идёт
# в pull request, второй был бы пустой тратой.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python 3.12 (как на сервере)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить библиотеки бота
        run: pip install -r requirements.txt

      # Тот же порядок, что в deploy.sh: сначала синтаксис, потом проверки.
      # Ключ -f обязателен: без него Python считает годной заранее
      # переведённую копию файла, и сломанный код проходит мимо проверки.
      - name: Синтаксис всех файлов
        run: python -m compileall -q -f -x '(\.venv|__pycache__)' .

      - name: preflight.py
        run: python preflight.py

      # Проверки поведения (2026-08-28). Стоят рядом с preflight по той же
      # причине, по какой стоят в deploy.sh: сервер забирает main САМ, и
      # сломанный расчёт денег или дыра в правах доедут до людей раньше,
      # чем их кто-нибудь заметит. Сети и ключей не требуют, как и preflight.
      - name: selftest.py
        run: python selftest.py
